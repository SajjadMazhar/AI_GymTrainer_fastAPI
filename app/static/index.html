<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Gym Trainer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="error-banner" class="error-banner" hidden></div>

  <section id="setup-screen" class="screen">
    <h1>AI Gym Trainer</h1>
    <label for="exercise-select">Exercise</label>
    <select id="exercise-select">
      <option value="squat">Squat</option>
      <option value="pushup">Push-up</option>
      <option value="bicep_curl">Bicep Curl</option>
      <option value="lunge">Lunge</option>
    </select>

    <label for="bodyweight-input">Bodyweight (kg)</label>
    <input id="bodyweight-input" type="number" min="20" max="300" step="0.5" value="70" />

    <button id="start-btn" class="primary-btn">Start Workout</button>
    <p class="hint">
      Prop your phone up so your whole body is visible, then tap Start and
      grant camera access.
    </p>

    <details class="upload-section">
      <summary>Test with a video upload (no camera)</summary>
      <label for="video-file-input">Video file</label>
      <input id="video-file-input" type="file" accept="video/*" />
      <button id="analyze-video-btn" class="secondary-btn">Analyze Video</button>
      <div id="video-result" class="video-result" hidden></div>
    </details>
  </section>

  <section id="workout-screen" class="screen" hidden>
    <div class="video-wrap">
      <video id="video" playsinline autoplay muted hidden></video>
      <canvas id="overlay"></canvas>
      <button id="flip-camera-btn" class="icon-btn" title="Switch camera">⟳</button>
    </div>

    <div class="hud">
      <div class="stat">
        <span class="stat-value" id="rep-count">0</span>
        <span class="stat-label">Reps</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="calories">0.0</span>
        <span class="stat-label">Calories</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="timer">00:00</span>
        <span class="stat-label">Time</span>
      </div>
    </div>

    <p id="feedback" class="feedback"></p>

    <button id="stop-btn" class="secondary-btn">Stop</button>
  </section>

  <script src="/static/app.js" defer></script>
</body>
</html>
