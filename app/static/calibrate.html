<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calibration - AI Gym Trainer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Personalized Calibration</h1>
    <p>Perform 5 reps to compute your personalized thresholds</p>
  </header>

  <section id="setup-screen" class="screen">
    <div class="form-group">
      <label for="user-id-input">User ID:</label>
      <input type="text" id="user-id-input" placeholder="your-name" value="user1">
    </div>

    <div class="form-group">
      <label for="exercise-select">Exercise:</label>
      <select id="exercise-select">
        <option value="squat">Squat</option>
        <option value="pushup">Push-up</option>
        <option value="bicep_curl">Bicep Curl</option>
        <option value="lunge">Lunge</option>
      </select>
    </div>

    <div class="form-group">
      <label for="bodyweight-input">Bodyweight (kg):</label>
      <input type="number" id="bodyweight-input" value="70" min="30" max="400" step="0.5">
    </div>

    <button id="start-btn" class="primary-btn">Start Calibration</button>
    <a href="/" class="secondary-btn">Back to Workout</a>
  </section>

  <section id="calibration-screen" class="screen" hidden>
    <div class="video-wrap">
      <video id="video" playsinline autoplay muted hidden></video>
      <canvas id="overlay"></canvas>
      <button id="flip-camera-btn" class="icon-btn" title="Switch camera">⟳</button>
    </div>

    <div class="hud">
      <div class="stat">
        <span class="stat-value" id="rep-count">0</span>
        <span class="stat-label">Reps</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="rep-target">5</span>
        <span class="stat-label">Target</span>
      </div>
    </div>

    <p id="status-message" class="feedback"></p>

    <button id="stop-btn" class="secondary-btn">Cancel</button>
  </section>

  <section id="complete-screen" class="screen" hidden>
    <h2>✓ Calibration Complete!</h2>
    <p id="complete-message"></p>
    <div id="calibration-results"></div>
    <a href="/" class="primary-btn">Start Workout</a>
    <a href="/static/calibrate.html" class="secondary-btn">Calibrate Another Exercise</a>
  </section>

  <div id="error-banner" class="error-banner" hidden></div>

  <script src="/static/calibrate.js" defer></script>
</body>
</html>
